name: Feature request
description: Suggest a capability or an improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
      placeholder: "As a tester, I need to … but currently …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Where does this fit?
      options:
        - P0 — release gate / correctness
        - P1 — team workflow (suites, schedules, collaboration)
        - P2 — AI, healing, plugins, enterprise
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
